<style>
  :root{
    --bg: #14110f;
    --bg2: #1c1815;
    --card: #211c18;
    --gold: #cba135;
    --gold-soft: #e8d29a;
    --text: #f3ece0;
    --muted: #a89a86;
    --line: #3a332b;
    --accent-koris: #7fa4b0;
    --accent-dejotaji: #c17d5a;
    --accent-teatris: #9b7fb0;
    --accent-ansamblis: #b0a17f;
    --accent-folklora: #7fb08a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:linear-gradient(180deg,var(--bg),var(--bg2) 400px);
    color:var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    -webkit-tap-highlight-color: transparent;
    padding-bottom:60px;
  }
  header{
    padding:22px 18px 16px;
    text-align:center;
    border-bottom:1px solid var(--line);
  }
  header .kicker{
    letter-spacing:3px;
    font-size:11px;
    color:var(--gold);
    text-transform:uppercase;
    font-family: Arial, sans-serif;
    margin-bottom:6px;
  }
  header h1{
    margin:0;
    font-size:26px;
    color:var(--gold-soft);
    font-weight:700;
    line-height:1.25;
  }
  header .sub{
    margin-top:8px;
    font-size:14px;
    color:var(--muted);
    font-family: Arial, sans-serif;
  }
  nav.tabs{
    display:flex;
    gap:6px;
    padding:14px 12px 6px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:20;
    border-bottom:1px solid var(--line);
    font-family: Arial, sans-serif;
    overflow-x:auto;
  }
  nav.tabs button{
    flex:1 0 auto;
    background:transparent;
    border:1px solid var(--line);
    color:var(--muted);
    padding:10px 12px;
    border-radius:8px;
    font-size:13px;
    font-family: Arial, sans-serif;
    letter-spacing:0.5px;
  }
  nav.tabs button.active{
    border-color:var(--gold);
    color:var(--gold-soft);
    background:rgba(203,161,53,0.08);
  }
  section.view{display:none; padding:16px 14px 4px;}
  section.view.active{display:block;}

  /* Timeline */
  .timeline{position:relative; margin-top:6px; padding-left:18px;}
  .timeline::before{
    content:"";
    position:absolute; left:5px; top:4px; bottom:4px;
    width:2px; background:var(--line);
  }
  .t-item{position:relative; padding:0 0 18px 14px;}
  .t-item::before{
    content:"";
    position:absolute; left:-19px; top:4px;
    width:10px; height:10px; border-radius:50%;
    background:var(--gold); border:2px solid var(--bg);
  }
  .t-item.highlight::before{background:var(--gold-soft); width:13px; height:13px; left:-20.5px;}
  .t-time{
    font-family: Arial, sans-serif;
    font-size:13px; color:var(--gold);
    font-weight:700; letter-spacing:0.5px;
  }
  .t-place{
    font-family: Arial, sans-serif;
    font-size:11.5px; color:var(--muted); margin-top:2px;
  }
  .t-event{font-size:16px; margin-top:3px; line-height:1.35;}
  .t-item.highlight .t-event{color:var(--gold-soft); font-weight:700;}
  .t-note{
    font-family: Arial, sans-serif;
    font-size:12.5px; color:var(--muted); margin-top:4px; font-style:italic;
  }
  .t-contact{
    font-family: Arial, sans-serif;
    font-size:13px; margin-top:5px;
  }
  .t-contact a{color:var(--gold-soft); text-decoration:none;}
  .order-btn{
    display:inline-block;
    font-family: Arial, sans-serif;
    font-size:12.5px;
    color:var(--bg);
    background:var(--gold-soft);
    border:none;
    padding:7px 12px;
    border-radius:16px;
    margin-top:8px;
    font-weight:700;
  }
  .order-panel{display:none; margin-top:10px; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .order-panel.open{display:block;}
  .order-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-bottom:1px solid var(--line);
    font-family: Arial, sans-serif;
    font-size:13.5px;
  }
  .order-row:last-child{border-bottom:none;}
  .order-row .o-nr{
    flex-shrink:0;
    width:22px; height:22px;
    border-radius:50%;
    background:var(--gold);
    color:#1a1611;
    font-weight:700;
    font-size:12px;
    display:flex; align-items:center; justify-content:center;
  }
  .order-row .o-name{flex:1; color:var(--text); font-family:Georgia, serif; font-size:14.5px;}
  .order-row .o-count{color:var(--muted); font-size:12px; flex-shrink:0;}
  .order-row.o-lead .o-nr{background:var(--gold-soft);}
  .order-row.o-lead .o-name{color:var(--muted); font-style:italic;}

  .search-wrap{padding:0 0 12px;}
  .search-wrap input{
    width:100%;
    padding:11px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--text);
    font-family: Arial, sans-serif;
    font-size:15px;
  }
  .kol-card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--gold);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .kol-head{
    padding:13px 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .kol-head .name{font-size:16.5px; line-height:1.3;}
  .kol-head .type{
    font-family: Arial, sans-serif;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--muted);
    margin-top:3px;

  .kol-card.open .chev{transform:rotate(180deg);}
  .kol-body{display:none; padding:0 14px 16px; border-top:1px solid var(--line);}
  .kol-card.open .kol-body{display:block;}
  .kol-body .timeline{margin-top:12px;}
  .badge{
    display:inline-block;
    font-family: Arial, sans-serif;
    font-size:11px;
    padding:3px 8px;
    border-radius:12px;
    margin-top:10px;
    margin-right:6px;
    color:var(--bg);
    font-weight:700;

  .badge.bus{background:var(--gold-soft);}
  .badge.gajiens{background:#e0c56b;}

  .contact-group h3{
    font-family: Arial, sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--gold);
    border-bottom:1px solid var(--line);
    padding-bottom:6px;
  }
  .contact-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:11px 0;
    border-bottom:1px solid var(--line);
    gap:10px;

  .contact-row .cname{font-size:15px;}
  .contact-row .crole{
    font-family: Arial, sans-serif;
    font-size:12px; color:var(--muted); margin-top:2px;
  }
  .contact-row a{
    font-family: Arial, sans-serif;
    color:var(--gold-soft);
    text-decoration:none;
    font-size:14.5px;
    white-space:nowrap;
    border:1px solid var(--gold);
    padding:6px 10px;
    border-radius:20px;
  }

  /* Map */
  .map-btn{
    display:block;
    text-align:center;
    background:var(--gold);
    color:#1a1611;
    font-family: Arial, sans-serif;
    font-weight:700;
    text-decoration:none;
    padding:16px;
    border-radius:10px;

    padding:14px;
    margin-bottom:10px;

  .bus-card .b-addr{

  .bus-card .b-kol{margin-top:8px; font-size:14px; line-height:1.5;}
  .bus-card .b-circle{
    display:inline-block;
    background:var(--gold);

    font-family: Arial, sans-serif;
    font-weight:700;
    font-size:12px;
    padding:2px 8px;
    border-radius:50%;

  }
  .footnote{
    font-family: Arial, sans-serif;
    font-size:12px;
    color:var(--muted);
    text-align:center;
    margin-top:20px;
    line-height:1.6;
  }
</style>
</head>

/* ---------- RENDER ---------- */

function telLink(phone){ return phone.replace(/\s+/g,""); }

let orderPanelCounter = 0;
function renderTimelineItems(items){
  return items.map(it => {
    let orderHtml = "";
    if (it.order){
      orderPanelCounter++;
      const pid = "orderPanel" + orderPanelCounter;
      orderHtml = `
        <button class="order-btn" onclick="toggleOrder('${pid}')">📋 Gājiena secība</button>
        <div class="order-panel" id="${pid}">
          ${it.order.map(o => `
            <div class="order-row ${o.lead ? "o-lead" : ""}">
              <div class="o-nr">${o.nr}</div>
              <div class="o-name">${o.name}</div>
              <div class="o-count">${o.skaits}</div>
            </div>
          `).join("")}
        </div>`;
    }
    return `
    <div class="t-item ${it.highlight ? "highlight" : ""}">
      <div class="t-time">${it.time}</div>
      <div class="t-place">${it.place}</div>
      <div class="t-event">${it.event}</div>
      ${it.note ? `<div class="t-note">${it.note}</div>` : ""}
      ${it.contacts ? it.contacts.map(c => `<div class="t-contact">📞 ${c.name}: <a href="tel:${telLink(c.phone)}">${c.phone}</a></div>`).join("") : ""}
      ${it.contact ? `<div class="t-contact">📞 ${it.contact.name}: <a href="tel:${telLink(it.contact.phone)}">${it.contact.phone}</a></div>` : ""}
      ${orderHtml}
    </div>
  `;
  }).join("");
}

window.toggleOrder = function(id){
  document.getElementById(id).classList.toggle("open");
};

document.getElementById("fullTimeline").innerHTML = renderTimelineItems(fullDayTimeline);

function renderKolList(filter){
  const f = (filter||"").toLowerCase();
  const list = kolektivi.filter(k => k.name.toLowerCase().includes(f) || k.type.includes(f));
  document.getElementById("kolList").innerHTML = list.map((k, i) => `
    <div class="kol-card" id="kol-${i}">
      <div class="kol-head" onclick="toggleKol(${i})">
        <div>
          <div class="name">${k.name}</div>
          <div class="type">${k.type}</div>
        </div>
        <div class="chev">▾</div>
      </div>
      <div class="kol-body">
        ${k.gajiensNr ? `<span class="badge gajiens">Gājienā: ${k.gajiensNr}. vietā</span>` : ""}
        <span class="badge bus">🚌 ${k.bus}</span>
        <div class="timeline">${renderTimelineItems(k.schedule)}</div>
      </div>
    </div>
  `).join("");
}
