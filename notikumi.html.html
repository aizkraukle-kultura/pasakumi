<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kultūras notikumi Aizkraukles novadā</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#F3F3F1;--card:#fff;--ink:#222;--muted:#6b6b6b;--navy:#1F3A5F;--gold:#B8913A;--line:#dcdad3;--onnavy:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1d232d;--ink:#eceae4;--muted:#9aa0aa;--navy:#8FB0DE;--gold:#D4AE5A;--line:#2e3644;--onnavy:#10213a}}
:root[data-theme="dark"]{--bg:#14181f;--card:#1d232d;--ink:#eceae4;--muted:#9aa0aa;--navy:#8FB0DE;--gold:#D4AE5A;--line:#2e3644;--onnavy:#10213a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
header{padding:28px 16px 8px;max-width:1100px;margin:0 auto}
h1{font:700 clamp(24px,5vw,38px)/1.15 Literata,Georgia,serif;color:var(--navy);margin:0;padding-bottom:12px;border-bottom:3px solid var(--gold)}
main{max-width:1100px;margin:0 auto;padding:8px 16px 40px}
.pw{position:relative;padding:12px 0;display:flex;gap:8px}
#pbtn{flex:1;max-width:380px;display:flex;justify-content:space-between;align-items:center;min-height:48px;border:1px solid var(--navy);background:var(--card);color:var(--navy);border-radius:10px;padding:0 16px;font:600 16px Figtree,sans-serif;cursor:pointer}
#pbtn[aria-expanded=true]{background:var(--navy);color:var(--onnavy)}
#pclr{width:48px;min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:22px;cursor:pointer}
#pmenu{position:absolute;top:calc(100% - 4px);left:0;z-index:5;width:100%;max-width:380px;max-height:min(60vh,calc(100dvh - 180px));overflow-y:auto;background:var(--card);border:1px solid var(--navy);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#pmenu[hidden]{display:none}
#pmenu button{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
#pmenu button:last-child{border-bottom:0}
#pmenu button[aria-pressed=true]{background:var(--navy);color:var(--onnavy)}
#pmenu button:disabled{color:var(--muted);opacity:.55;cursor:default}
#pmenu .n{font-weight:600;color:var(--gold)}
#pmenu button[aria-pressed=true] .n{color:var(--onnavy)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;max-width:380px;margin-bottom:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font:600 17px Literata,Georgia,serif;color:var(--navy)}
.cal-h button{border:0;background:none;color:var(--navy);font-size:22px;padding:4px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:8px}
.grid span.w{font-size:12px;color:var(--muted);padding:4px 0}
.grid button{aspect-ratio:1;border:0;background:none;color:var(--ink);font:inherit;border-radius:8px;position:relative;cursor:pointer}
.grid button:disabled{color:var(--muted);opacity:.45;cursor:default}
.grid button.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.grid button.sel{background:var(--navy);color:var(--onnavy)}
.grid button.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.status{display:flex;gap:12px;align-items:center;min-height:36px;color:var(--muted)}
.status button{border:0;background:none;color:var(--navy);font:600 15px Figtree,sans-serif;text-decoration:underline;cursor:pointer;padding:0}
.list{align-items:start;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.list{grid-template-columns:repeat(4,1fr);gap:18px}}
.ev{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column}
.ev:hover{border-color:var(--gold)}
.pimg{display:block;width:100%;height:auto}
.poster{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:#fff;font:700 18px Literata,Georgia,serif;text-align:center;padding:12px;background-size:cover;background-position:center}
.txt{padding:10px 12px 12px}
.when{font-weight:600;color:var(--navy)}
.where{color:var(--muted);font-size:14px}
.name{font-weight:600;margin-top:4px;line-height:1.3}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:12px;padding:0;width:fit-content;min-width:min(340px,94vw);max-width:min(760px,94vw);max-height:94vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,25,.7)}
.m-poster{display:flex;align-items:center;justify-content:center;color:#fff;font:700 24px Literata,Georgia,serif;text-align:center;overflow:hidden}
.m-poster:not(.img){aspect-ratio:3/4;width:min(360px,80vw);padding:20px}
.m-poster.img{background:var(--bg)}
.m-poster img{display:block;width:auto;max-width:100%;height:auto;max-height:68vh;object-fit:contain;margin:0 auto}
.m-body{padding:14px 18px 8px}
.m-body p{white-space:pre-line}
.m-body h2{font:700 22px/1.2 Literata,Georgia,serif;color:var(--navy);margin:0 0 6px}
.m-nav{display:flex;justify-content:space-between;padding:8px 12px 14px}
.m-nav button{border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:8px;padding:8px 16px;font:600 15px Figtree,sans-serif;cursor:pointer}
.close{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;cursor:pointer}
</style>
</head>
<body>
<header><h1>Kultūras notikumi Aizkraukles novadā</h1></header>
<main>
  <div class="pw"><button id="pbtn" aria-haspopup="true" aria-expanded="false"><span id="plabel">Norises vietas</span><span aria-hidden="true">▾</span></button><button id="pclr" aria-label="Rādīt visas vietas" hidden>×</button><div id="pmenu" hidden></div></div>
  <div class="cal" id="cal"></div>
  <div class="status" id="status"></div>
  <div class="list" id="list"></div>
</main>
<dialog id="dlg">
  <button class="close" id="x" aria-label="Aizvērt">×</button>
  <div class="m-poster" id="mp"></div>
  <div class="m-body"><h2 id="mt"></h2><div class="when" id="mw"></div><div class="where" id="mv"></div><p id="md"></p></div>
  <div class="m-nav"><button id="prev">Iepriekšējais</button><button id="next">Nākamais</button></div>
</dialog>
<script>
// DATI: nolasa no Google Sheet cilnes "Publiskie" (publicēta kā CSV)
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vS64ak12h94wzAxpJ_v87ZXhasASL7Obrcknm61L87brVD93i9n3e2vl4f6fPziWDBtNjcIJ8rahsNz/pub?gid=1614628350&single=true&output=csv';
let EVENTS=[];
function d(off){const t=new Date();t.setDate(t.getDate()+off);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
const MON=['Janvāris','Februāris','Marts','Aprīlis','Maijs','Jūnijs','Jūlijs','Augusts','Septembris','Oktobris','Novembris','Decembris'];
const DOW=['Pr','Ot','Tr','Ce','Pk','Se','Sv'];
const DAYN=['svētdiena','pirmdiena','otrdiena','trešdiena','ceturtdiena','piektdiena','sestdiena'];
const PLACES=['Aizkrauklē','Aiviekstē','Bebros','Daudzesē','Iršos','Jaunjelgavā','Klintainē','Koknesē','Mazzalvē','Neretā','Pilskalnē','Pļaviņās','Secē','Sērenē','Skrīveros','Staburagā','Sunākstē','Vietalvā','Zalvē','Citviet'];
const COLS=['#1F3A5F','#2F5D50','#7A3B3B','#4B3F72','#8A6A1F','#2B5C7A'];
const todayS=d(0), now=new Date();
let place='Visi', day=null, vm=now.getMonth(), vy=now.getFullYear(), cur=[], idx=0;
const $=id=>document.getElementById(id);
const upcoming=()=>EVENTS.filter(e=>e.date>=todayS).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const byPlace=l=>place==='Visi'?l:l.filter(e=>e.place===place);
const fmt=e=>{const [y,m,dd]=e.date.split('-').map(Number);return dd+'. '+MON[m-1].toLowerCase()+', '+e.time};
const mfmt=e=>{const [y,m,dd]=e.date.split('-').map(Number);const g=['janvārī','februārī','martā','aprīlī','maijā','jūnijā','jūlijā','augustā','septembrī','oktobrī','novembrī','decembrī'];const G=['janvāris','februāris','marts','aprīlis','maijs','jūnijs','jūlijs','augusts','septembris','oktobris','novembris','decembris'];return dd+'. '+G[m-1]+', '+DAYN[new Date(y,m-1,dd).getDay()]+', plkst. '+e.time};
function color(e){return COLS[(e.title.length+e.place.length)%COLS.length]}
function render(){
  const up=upcoming();
  const cnt={};up.forEach(e=>cnt[e.place]=(cnt[e.place]||0)+1);
  $('plabel').textContent=place==='Visi'?'Norises vietas':'Norises vieta: '+place;
  $('pclr').hidden=place==='Visi';
  $('pmenu').innerHTML='';
  const all=document.createElement('button');all.textContent='Visas vietas';all.setAttribute('aria-pressed',place==='Visi');
  all.onclick=()=>{place='Visi';day=null;render();menu(false)};$('pmenu').appendChild(all);
  PLACES.forEach(p=>{const b=document.createElement('button');const c=cnt[p]||0;b.innerHTML='<span></span><span class="n">'+(c||'')+'</span>';b.firstChild.textContent=p;b.disabled=!c;b.setAttribute('aria-pressed',p===place);
    b.onclick=()=>{place=p;day=null;render();menu(false)};$('pmenu').appendChild(b)});
  // kalendārs
  const pl=byPlace(up), has=new Set(pl.map(e=>e.date));
  const first=new Date(vy,vm,1), off=(first.getDay()+6)%7, n=new Date(vy,vm+1,0).getDate();
  let h='<div class="cal-h"><button id="pm" aria-label="Iepriekšējais mēnesis">‹</button><span>'+MON[vm]+' '+vy+'</span><button id="nm" aria-label="Nākamais mēnesis">›</button></div><div class="grid">'+DOW.map(x=>'<span class="w">'+x+'</span>').join('');
  for(let i=0;i<off;i++)h+='<span></span>';
  for(let i=1;i<=n;i++){const s=vy+'-'+String(vm+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    h+='<button data-d="'+s+'" class="'+(has.has(s)?'has ':'')+(s===day?'sel ':'')+(s===todayS?'today':'')+'"'+(has.has(s)?'':' disabled')+'>'+i+'</button>'}
  $('cal').innerHTML=h+'</div>';
  $('pm').onclick=()=>{vm--;if(vm<0){vm=11;vy--}render()};
  $('nm').onclick=()=>{vm++;if(vm>11){vm=0;vy++}render()};
  $('cal').querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{day=day===b.dataset.d?null:b.dataset.d;render()});
  // saraksts
  cur=pl.filter(e=>!day||e.date===day);
  $('status').innerHTML=day?'<span>Rāda: '+day.split('-').reverse().join('.')+'</span><button id="all">Rādīt visu</button>':'<span>'+cur.length+' tuvākie pasākumi</span>';
  if($('all'))$('all').onclick=()=>{day=null;render()};
  $('list').innerHTML=cur.length?'':'<div class="empty" style="grid-column:1/-1">Šeit pagaidām nav pasākumu.</div>';
  cur.forEach((e,i)=>{const b=document.createElement('button');b.className='ev';
    b.innerHTML=(e.image?'<img class="pimg" loading="lazy" alt="" src="'+e.image+'">':'<div class="poster" style="background-color:'+color(e)+'">Afiša</div>')+'<div class="txt"><div class="when">'+fmt(e)+'</div><div class="where">'+e.place+'</div><div class="name"></div></div>';
    const im=b.querySelector('.pimg');if(im)im.onerror=()=>{im.outerHTML='<div class="poster" style="background-color:'+color(e)+'">Afiša</div>'};b.querySelector('.name').textContent=e.title;b.onclick=()=>open(i);$('list').appendChild(b)});
}
function menu(o){$('pmenu').hidden=!o;$('pbtn').setAttribute('aria-expanded',o)}
$('pbtn').onclick=e=>{e.stopPropagation();menu($('pmenu').hidden)};
$('pclr').onclick=()=>{place='Visi';day=null;render()};
document.addEventListener('click',e=>{if(!$('pmenu').contains(e.target))menu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
function open(i){idx=(i+cur.length)%cur.length;const e=cur[idx];
  $('mp').className='m-poster'+(e.image?' img':'');$('mp').style.background=e.image?'':color(e);$('mp').innerHTML=e.image?'<img alt="Afiša: '+e.title.replace(/"/g,'')+'" src="'+e.image+'">':'Afiša';
  $('mt').textContent=e.title;$('mw').textContent=mfmt(e);$('mv').textContent=e.place;$('md').textContent=e.desc;
  $('prev').style.visibility=$('next').style.visibility=cur.length>1?'visible':'hidden';
  if(!$('dlg').open)$('dlg').showModal();}
$('x').onclick=()=>$('dlg').close();
$('prev').onclick=()=>open(idx-1);$('next').onclick=()=>open(idx+1);
$('dlg').addEventListener('click',ev=>{if(ev.target===$('dlg'))$('dlg').close()});
let sx=0;$('dlg').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('dlg').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)open(idx+(dx<0?1:-1))});

function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows;
}
function load(){
  $('status').textContent='Ielādē pasākumus...';
  fetch(CSV_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(t=>{
    const rows=parseCSV(t).filter(r=>r.length>=5&&r[1]);
    EVENTS=rows.slice(1).map(r=>({date:r[1].trim(),time:(r[2]||'').trim(),place:(r[3]||'').trim(),title:(r[4]||'').trim(),desc:(r[5]||'').trim(),
      image:(r[6]||'').trim()?'https://drive.google.com/thumbnail?id='+r[6].trim()+'&sz=w1200':''}));
    render();
  }).catch(()=>{$('status').textContent='';$('list').innerHTML='<div class="empty" style="grid-column:1/-1">Neizdevās ielādēt pasākumus. Pamēģini vēlreiz pēc brīža.</div>'});
}
load();
</script>
</body>
</html>
