<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F3A5F">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notikumi">
<title>Kultūras notikumi Aizkraukles novadā</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:wght@600;700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#F3F3F1;--card:#fff;--ink:#222;--muted:#6b6b6b;--navy:#1F3A5F;--gold:#B8913A;--line:#dcdad3;--onnavy:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1d232d;--ink:#eceae4;--muted:#9aa0aa;--navy:#8FB0DE;--gold:#D4AE5A;--line:#2e3644;--onnavy:#10213a}}
:root[data-theme="dark"]{--bg:#14181f;--card:#1d232d;--ink:#eceae4;--muted:#9aa0aa;--navy:#8FB0DE;--gold:#D4AE5A;--line:#2e3644;--onnavy:#10213a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
header{padding:28px 16px 8px;max-width:1100px;margin:0 auto}
h1{font:700 clamp(24px,5vw,38px)/1.15 Literata,Georgia,serif;color:var(--navy);margin:0;padding-bottom:12px;border-bottom:3px solid var(--gold)}
main{max-width:1100px;margin:0 auto;padding:8px 16px 40px}
.tabs{display:flex;margin:14px 0 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;max-width:190px;min-height:48px;border:0;background:none;color:var(--muted);font:600 17px Literata,Georgia,serif;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--gold)}
.grp{grid-column:1/-1;font:700 18px Literata,Georgia,serif;color:var(--navy);margin:10px 0 0}
.install{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:15px}
.install[hidden]{display:none}
.install button{border:1px solid var(--navy);background:var(--card);color:var(--navy);border-radius:8px;padding:8px 14px;font:600 15px Figtree,sans-serif;cursor:pointer}
.install #instx{border:0;margin-left:auto;font-size:20px;padding:4px 10px}
.pw{position:relative;padding:12px 0;display:flex;gap:8px}
#pbtn{flex:1;max-width:380px;display:flex;justify-content:space-between;align-items:center;min-height:48px;border:1px solid var(--navy);background:var(--card);color:var(--navy);border-radius:10px;padding:0 16px;font:600 16px Figtree,sans-serif;cursor:pointer}
#pbtn[aria-expanded=true]{background:var(--navy);color:var(--onnavy)}
#pclr{width:48px;min-height:48px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:22px;cursor:pointer}
#pmenu{position:absolute;top:calc(100% - 4px);left:0;z-index:5;width:100%;max-width:380px;max-height:min(60vh,calc(100dvh - 180px));overflow-y:auto;background:var(--card);border:1px solid var(--navy);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#pmenu[hidden]{display:none}
#pmenu button{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
#pmenu button:last-child{border-bottom:0}
#pmenu button[aria-pressed=true]{background:var(--navy);color:var(--onnavy)}
#pmenu button:disabled{color:var(--muted);opacity:.55;cursor:default}
#pmenu .n{font-weight:600;color:var(--gold)}
#pmenu button[aria-pressed=true] .n{color:var(--onnavy)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;max-width:380px;margin-bottom:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;font:600 17px Literata,Georgia,serif;color:var(--navy)}
.cal-h button{border:0;background:none;color:var(--navy);font-size:22px;padding:4px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:8px}
.grid span.w{font-size:12px;color:var(--muted);padding:4px 0}
.grid button{aspect-ratio:1;border:0;background:none;color:var(--ink);font:inherit;border-radius:8px;position:relative;cursor:pointer}
.grid button:disabled{color:var(--muted);opacity:.45;cursor:default}
.grid button.has::after{content:"";position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.grid button.sel{background:var(--navy);color:var(--onnavy)}
.grid button.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.status{display:flex;gap:12px;align-items:center;min-height:36px;color:var(--muted)}
.status button{border:0;background:none;color:var(--navy);font:600 15px Figtree,sans-serif;text-decoration:underline;cursor:pointer;padding:0}
.list{align-items:start;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.list{grid-template-columns:repeat(4,1fr);gap:18px}}
.ev{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;padding:0;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column}
.ev:hover{border-color:var(--gold)}
.pimg{display:block;width:100%;height:auto}
.poster{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:#fff;font:700 18px Literata,Georgia,serif;text-align:center;padding:12px;background-size:cover;background-position:center}
.txt{padding:10px 12px 12px}
.when{font-weight:600;color:var(--navy)}
.where{color:var(--muted);font-size:16px}
.name{font-weight:600;margin-top:4px;line-height:1.3}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:12px;padding:0;width:fit-content;min-width:min(340px,94vw);max-width:min(760px,94vw);max-height:94vh;overflow:auto;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,25,.7)}
.m-poster{display:flex;align-items:center;justify-content:center;color:#fff;font:700 24px Literata,Georgia,serif;text-align:center;overflow:hidden}
.m-poster:not(.img){aspect-ratio:3/4;width:min(360px,80vw);padding:20px}
.m-poster.img{background:var(--bg)}
.m-poster img{display:block;width:auto;max-width:100%;height:auto;max-height:68vh;object-fit:contain;margin:0 auto}
.m-body{padding:14px 18px 8px}
.m-body p{white-space:pre-line}
.m-body h2{font:700 22px/1.2 Literata,Georgia,serif;color:var(--navy);margin:0 0 6px}
.m-nav{display:flex;justify-content:space-between;padding:8px 12px 14px}
.m-nav button{border:1px solid var(--line);background:var(--card);color:var(--navy);border-radius:8px;padding:8px 16px;font:600 15px Figtree,sans-serif;cursor:pointer}
.close{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;cursor:pointer}

.views{display:inline-flex;border:1px solid var(--navy);border-radius:10px;overflow:hidden;margin:2px 0 8px}
.views button{border:0;background:var(--card);color:var(--navy);padding:0 20px;min-height:44px;font:600 15px Figtree,sans-serif;cursor:pointer}
.views button[aria-pressed=true]{background:var(--navy);color:var(--onnavy)}
.list.rows{display:block}
.row{display:flex;gap:14px;width:100%;min-height:56px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.row:hover{border-color:var(--gold)}
.rt{flex:none;width:52px;font-weight:600;color:var(--navy)}
.rb{display:flex;flex-direction:column;min-width:0}
.rn{font-weight:600;line-height:1.3}
.list.rows .grp{margin:18px 0 8px}
.m-act{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.m-act button{border:1px solid var(--navy);background:var(--card);color:var(--navy);border-radius:8px;padding:10px 14px;font:600 15px Figtree,sans-serif;cursor:pointer}
.m-body a{color:var(--navy);text-decoration:underline;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--onnavy);padding:10px 18px;border-radius:20px;font-size:15px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.list.cards{display:block}
.rw{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start;border-top:2px solid var(--gold);padding-top:14px;margin-top:14px}
@media(min-width:700px){.rw{grid-template-columns:repeat(4,1fr);gap:18px}}
</style>
</head>
<body>
<header><h1>Kultūras notikumi Aizkraukles novadā</h1></header>
<main>
  <div class="tabs" role="tablist"><button role="tab" id="t-pas" aria-selected="true">Pasākumi</button><button role="tab" id="t-izst" aria-selected="false">Izstādes</button></div>
  <div class="pw"><button id="pbtn" aria-haspopup="true" aria-expanded="false"><span id="plabel">Norises vietas</span><span aria-hidden="true">▾</span></button><button id="pclr" aria-label="Rādīt visas vietas" hidden>×</button><div id="pmenu" hidden></div></div>
  <div class="cal" id="cal"></div>
  <div class="views" role="group" aria-label="Skats"><button id="v-afisas" aria-pressed="true">Afišas</button><button id="v-saraksts" aria-pressed="false">Saraksts</button></div>
  <div class="status" id="status"></div>
  <div class="list" id="list"></div>
  <div class="install" id="inst" hidden><span id="insttxt"></span><button id="instbtn" hidden>Pievienot sākuma ekrānam</button><button id="instx" aria-label="Aizvērt">×</button></div>
</main>
<div id="toast" role="status"></div>
<dialog id="dlg">
  <button class="close" id="x" aria-label="Aizvērt">×</button>
  <div class="m-poster" id="mp"></div>
  <div class="m-body"><h2 id="mt"></h2><div class="when" id="mw"></div><div class="where" id="mv"></div><p id="md"></p><div class="m-act"><button id="addcal">Pievienot kalendāram</button><button id="share">Dalīties</button></div></div>
  <div class="m-nav"><button id="prev">Iepriekšējais</button><button id="next">Nākamais</button></div>
</dialog>
<script>
// DATI: nolasa no Google Sheet cilnes "Publiskie" (publicēta kā CSV)
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vS64ak12h94wzAxpJ_v87ZXhasASL7Obrcknm61L87brVD93i9n3e2vl4f6fPziWDBtNjcIJ8rahsNz/pub?gid=1614628350&single=true&output=csv';
let EVENTS=[];
function d(off){const t=new Date();t.setDate(t.getDate()+off);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
const MON=['Janvāris','Februāris','Marts','Aprīlis','Maijs','Jūnijs','Jūlijs','Augusts','Septembris','Oktobris','Novembris','Decembris'];
const DOW=['Pr','Ot','Tr','Ce','Pk','Se','Sv'];
const DAYN=['svētdiena','pirmdiena','otrdiena','trešdiena','ceturtdiena','piektdiena','sestdiena'];
const PLACES=['Aizkrauklē','Aiviekstē','Bebros','Daudzesē','Iršos','Jaunjelgavā','Klintainē','Koknesē','Mazzalvē','Neretā','Pilskalnē','Pļaviņās','Secē','Sērenē','Skrīveros','Staburagā','Sunākstē','Vietalvā','Zalvē','Citviet'];
const COLS=['#1F3A5F','#2F5D50','#7A3B3B','#4B3F72','#8A6A1F','#2B5C7A'];
const todayS=d(0), now=new Date();
let tab='pas', view='afisas', place='Visi', day=null, vm=now.getMonth(), vy=now.getFullYear(), cur=[], idx=0;
const $=id=>document.getElementById(id);
const upcoming=()=>{
  if(tab==='pas')return EVENTS.filter(e=>e.kind==='pas'&&e.date>=todayS).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const ex=EVENTS.filter(e=>e.kind==='izst'&&e.end>=todayS);
  const on=ex.filter(e=>e.date<=todayS).sort((a,b)=>a.end.localeCompare(b.end));
  const soon=ex.filter(e=>e.date>todayS).sort((a,b)=>a.date.localeCompare(b.date));
  return on.concat(soon);
};
const byPlace=l=>place==='Visi'?l:l.filter(e=>e.place===place);
const mn=m=>MON[m-1].toLowerCase();
function range(e){const [y1,m1,d1]=e.date.split('-').map(Number),[y2,m2,d2]=e.end.split('-').map(Number);
  if(e.end===e.date)return d1+'. '+mn(m1);
  if(y1===y2&&m1===m2)return d1+'.–'+d2+'. '+mn(m2);
  return d1+'. '+mn(m1)+(y1!==y2?' '+y1:'')+' – '+d2+'. '+mn(m2)+(y1!==y2?' '+y2:'')}
const fmt=e=>{if(e.kind==='izst')return range(e);const [y,m,dd]=e.date.split('-').map(Number);return dd+'. '+mn(m)+', '+e.time};
const mfmt=e=>{if(e.kind==='izst')return range(e)+(e.time?', plkst. '+e.time:'');const [y,m,dd]=e.date.split('-').map(Number);return dd+'. '+mn(m)+', '+DAYN[new Date(y,m-1,dd).getDay()]+', plkst. '+e.time};
function color(e){return COLS[(e.title.length+e.place.length)%COLS.length]}
const pl2=(n,one,many)=>n+' '+((n%10===1&&n%100!==11)?one:many);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n};
function dayHead(ds){const [y,m,dd]=ds.split('-').map(Number);const w=DAYN[new Date(y,m-1,dd).getDay()];
  return w[0].toUpperCase()+w.slice(1)+', '+dd+'. '+mn(m)+(ds===todayS?' (šodien)':'')}
function render(){
  const up=upcoming();
  const cnt={};up.forEach(e=>cnt[e.place]=(cnt[e.place]||0)+1);
  $('plabel').textContent=place==='Visi'?'Norises vietas':'Norises vieta: '+place;
  $('pclr').hidden=place==='Visi';
  $('pmenu').innerHTML='';
  const all=document.createElement('button');all.textContent='Visas vietas';all.setAttribute('aria-pressed',place==='Visi');
  all.onclick=()=>{place='Visi';day=null;render();menu(false)};$('pmenu').appendChild(all);
  PLACES.forEach(p=>{const b=document.createElement('button');const c=cnt[p]||0;b.innerHTML='<span></span><span class="n">'+(c||'')+'</span>';b.firstChild.textContent=p;b.disabled=!c;b.setAttribute('aria-pressed',p===place);
    b.onclick=()=>{place=p;day=null;render();menu(false)};$('pmenu').appendChild(b)});
  $('v-afisas').setAttribute('aria-pressed',view==='afisas');$('v-saraksts').setAttribute('aria-pressed',view==='saraksts');
  // kalendārs
  const pl=byPlace(up), has=new Set(pl.map(e=>e.date));
  const first=new Date(vy,vm,1), off=(first.getDay()+6)%7, n=new Date(vy,vm+1,0).getDate();
  let h='<div class="cal-h"><button id="pm" aria-label="Iepriekšējais mēnesis">‹</button><span>'+MON[vm]+' '+vy+'</span><button id="nm" aria-label="Nākamais mēnesis">›</button></div><div class="grid">'+DOW.map(x=>'<span class="w">'+x+'</span>').join('');
  for(let i=0;i<off;i++)h+='<span></span>';
  for(let i=1;i<=n;i++){const s=vy+'-'+String(vm+1).padStart(2,'0')+'-'+String(i).padStart(2,'0');
    h+='<button data-d="'+s+'" class="'+(has.has(s)?'has ':'')+(s===day?'sel ':'')+(s===todayS?'today':'')+'"'+(has.has(s)?'':' disabled')+'>'+i+'</button>'}
  $('cal').innerHTML=h+'</div>';
  $('pm').onclick=()=>{vm--;if(vm<0){vm=11;vy--}day=null;render()};
  $('nm').onclick=()=>{vm++;if(vm>11){vm=0;vy++}day=null;render()};
  $('cal').querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{day=day===b.dataset.d?null:b.dataset.d;render()});
  // saraksts: pasākumiem tikai izvēlētais mēnesis vai diena
  const mk=vy+'-'+String(vm+1).padStart(2,'0');
  cur=tab==='pas'?pl.filter(e=>day?e.date===day:e.date.slice(0,7)===mk):pl;
  const head=tab==='izst'?pl2(cur.length,'izstāde','izstādes'):pl2(cur.length,'pasākums','pasākumi')+', '+mn(vm+1)+' '+vy;
  $('status').innerHTML=day?'<span>Rāda: '+day.split('-').reverse().join('.')+'</span><button id="all">Rādīt visu mēnesi</button>':'<span></span>';
  if(!day)$('status').firstChild.textContent=head;
  if($('all'))$('all').onclick=()=>{day=null;render()};
  const L=$('list');L.className='list'+(view==='saraksts'?' rows':' cards');
  L.innerHTML=cur.length?'':'<div class="empty" style="grid-column:1/-1">'+(tab==='izst'?'Šeit pagaidām nav izstāžu.':'Šeit pasākumu nav.')+'</div>';
  let lastG=null,wrap=null;const C=matchMedia('(min-width:700px)').matches?4:2;
  cur.forEach((e,i)=>{
    let g=null;
    if(tab==='izst')g=e.date<=todayS?'Apskatāmas tagad':'Drīzumā';
    else if(view==='saraksts')g=dayHead(e.date);
    if(g!==null&&g!==lastG){L.appendChild(el('h2','grp',g));lastG=g;wrap=null}
    const b=document.createElement('button');
    if(view==='saraksts'){
      b.className='row';
      const rb=el('span','rb');
      if(tab==='pas'){b.appendChild(el('span','rt',e.time));rb.appendChild(el('span','rn',e.title));rb.appendChild(el('span','where',e.place))}
      else{rb.appendChild(el('span','rn',e.title));rb.appendChild(el('span','where',range(e)+', '+e.place))}
      b.appendChild(rb);
    }else{
      b.className='ev';
      b.innerHTML=(e.image?'<img class="pimg" loading="lazy" alt="" src="'+e.image+'">':'<div class="poster" style="background-color:'+color(e)+'">Afiša</div>')+'<div class="txt"><div class="when"></div><div class="where"></div><div class="name"></div></div>';
      b.querySelector('.when').textContent=fmt(e);b.querySelector('.where').textContent=e.place;b.querySelector('.name').textContent=e.title;
      const im=b.querySelector('.pimg');if(im)im.onerror=()=>{im.outerHTML='<div class="poster" style="background-color:'+color(e)+'">Afiša</div>'};
    }
    b.onclick=()=>open(i);
    if(view==='saraksts')L.appendChild(b);
    else{if(!wrap||wrap.children.length>=C){wrap=el('div','rw');L.appendChild(wrap)}wrap.appendChild(b)}
  });
}
try{matchMedia('(min-width:700px)').addEventListener('change',()=>render())}catch(e){}
function setTab(t,pop){if(t===tab)return;tab=t;day=null;
  $('t-pas').setAttribute('aria-selected',t==='pas');$('t-izst').setAttribute('aria-selected',t==='izst');
  $('cal').hidden=t!=='pas';render();
  if(!pop&&t==='izst')history.pushState({tab:'izst'},'','#izstades')}
$('t-pas').onclick=()=>{if(tab!=='izst')return;if(history.state&&history.state.tab==='izst')history.back();else setTab('pas',true)};
$('t-izst').onclick=()=>setTab('izst');
$('v-afisas').onclick=()=>{view='afisas';render()};
$('v-saraksts').onclick=()=>{view='saraksts';render()};
function menu(o){$('pmenu').hidden=!o;$('pbtn').setAttribute('aria-expanded',o)}
$('pbtn').onclick=e=>{e.stopPropagation();menu($('pmenu').hidden)};
$('pclr').onclick=()=>{place='Visi';day=null;render()};
document.addEventListener('click',e=>{if(!$('pmenu').contains(e.target))menu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});

function linkify(box,text){
  box.textContent='';const re=/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/g;let last=0,m;
  while((m=re.exec(text))){
    let u=m[0],tail='';const mm=u.match(/[.,;:!?)\]”»]+$/);if(mm){tail=mm[0];u=u.slice(0,-tail.length)}
    box.appendChild(document.createTextNode(text.slice(last,m.index)));
    const a=document.createElement('a');a.href=/^www\./i.test(u)?'https://'+u:u;a.target='_blank';a.rel='noopener noreferrer';a.textContent=u;box.appendChild(a);
    if(tail)box.appendChild(document.createTextNode(tail));
    last=m.index+m[0].length;
  }
  box.appendChild(document.createTextNode(text.slice(last)));
}
function toast(t){const n=$('toast');n.textContent=t;n.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>n.classList.remove('on'),2500)}
const evUrl=e=>location.origin+location.pathname+'#e='+encodeURIComponent(e.id);

function open(i){idx=(i+cur.length)%cur.length;const e=cur[idx];
  $('mp').className='m-poster'+(e.image?' img':'');$('mp').style.background=e.image?'':color(e);$('mp').innerHTML=e.image?'<img alt="Afiša: '+e.title.replace(/"/g,'')+'" src="'+e.image+'">':'Afiša';
  $('mt').textContent=e.title;$('mw').textContent=mfmt(e);$('mv').textContent=e.place;linkify($('md'),e.desc);
  $('prev').style.visibility=$('next').style.visibility=cur.length>1?'visible':'hidden';
  const st={modal:1,tab:tab},h=e.id?'#e='+encodeURIComponent(e.id):'#';
  if(!$('dlg').open){$('dlg').showModal();history.pushState(st,'',h)}else history.replaceState(st,'',h);
  $('dlg').scrollTop=0;}
function closeDlg(){if(history.state&&history.state.modal)history.back();else $('dlg').close()}
$('x').onclick=closeDlg;
$('prev').onclick=()=>open(idx-1);$('next').onclick=()=>open(idx+1);
$('dlg').addEventListener('click',ev=>{if(ev.target===$('dlg'))closeDlg()});
$('dlg').addEventListener('close',()=>{if(history.state&&history.state.modal)history.back()});
addEventListener('popstate',ev=>{if($('dlg').open)$('dlg').close();setTab((ev.state&&ev.state.tab)==='izst'?'izst':'pas',true)});
let sx=0;$('dlg').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
$('dlg').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60)open(idx+(dx<0?1:-1))});

// Kopīgošana un kalendārs
$('share').onclick=()=>{const e=cur[idx],url=evUrl(e),text=e.title+'\n'+mfmt(e)+', '+e.place;
  if(navigator.share)navigator.share({title:e.title,text:text,url:url}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(text+'\n'+url).then(()=>toast('Saite nokopēta')).catch(()=>prompt('Nokopē saiti:',url));
  else prompt('Nokopē saiti:',url)};
const pad=n=>String(n).padStart(2,'0');
const ymd=s=>s.replace(/-/g,'');
function addDays(s,n){const [y,m,dd]=s.split('-').map(Number);const t=new Date(y,m-1,dd+n);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
const icsEsc=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function makeICS(e){
  let dt;
  if(e.kind==='izst'||!e.time){dt='DTSTART;VALUE=DATE:'+ymd(e.date)+'\r\nDTEND;VALUE=DATE:'+ymd(addDays(e.kind==='izst'?e.end:e.date,1))}
  else{const [h,mi]=e.time.split(':').map(Number),[y,m,dd]=e.date.split('-').map(Number);
    const f=t=>t.getFullYear()+pad(t.getMonth()+1)+pad(t.getDate())+'T'+pad(t.getHours())+pad(t.getMinutes())+'00';
    dt='DTSTART:'+f(new Date(y,m-1,dd,h,mi))+'\r\nDTEND:'+f(new Date(y,m-1,dd,h+2,mi))}
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Kulturas notikumi//LV','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+(e.id||Date.now())+'@aizkraukle-kultura.github.io','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,''),
    dt,'SUMMARY:'+icsEsc(e.title),'LOCATION:'+icsEsc(e.place+', Aizkraukles novads'),
    'DESCRIPTION:'+icsEsc((e.desc?e.desc+'\n\n':'')+evUrl(e)),'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
$('addcal').onclick=()=>{const e=cur[idx];
  const url=URL.createObjectURL(new Blob([makeICS(e)],{type:'text/calendar;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='notikums.ics';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Atver failu, lai pievienotu kalendāram')};

function parseCSV(t){
  const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){r.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  return rows;
}
function load(){
  $('status').textContent='Ielādē pasākumus...';
  fetch(CSV_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(t=>{
    const rows=parseCSV(t).filter(r=>r.length>=5&&r[1]);
    EVENTS=rows.slice(1).map(r=>({id:(r[0]||'').trim(),date:r[1].trim(),time:(r[2]||'').trim(),place:(r[3]||'').trim(),title:(r[4]||'').trim(),desc:(r[5]||'').trim(),
      kind:(r[7]||'').trim().toLowerCase().startsWith('izst')?'izst':'pas',end:(r[8]||'').trim()||r[1].trim(),
      image:(r[6]||'').trim()?'https://drive.google.com/thumbnail?id='+r[6].trim()+'&sz=w1200':''}));
    render();deepLink();
  }).catch(()=>{$('status').textContent='';$('list').innerHTML='<div class="empty" style="grid-column:1/-1">Neizdevās ielādēt pasākumus. Pamēģini vēlreiz pēc brīža.</div>'});
}
function deepLink(){
  const m=h0.match(/^#e=(.+)$/);if(!m)return;
  const id=decodeURIComponent(m[1]),e=EVENTS.find(x=>x.id===id);if(!e)return;
  setTab(e.kind==='izst'?'izst':'pas');place='Visi';day=null;
  if(e.kind!=='izst'){const p=e.date.split('-');vy=+p[0];vm=+p[1]-1}
  render();const i=cur.indexOf(e);if(i>=0)open(i);
}
const h0=location.hash;
history.replaceState({tab:'pas'},'',location.pathname+location.search);
if(h0==='#izstades')setTab('izst');
load();

// Aplikācijas režīms (PWA)
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(function(){
  let dp=null, dismissed=false;
  const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  try{dismissed=localStorage.getItem('instx')==='1'}catch(e){}
  const show=(txt,btn)=>{if(standalone||dismissed)return;$('insttxt').textContent=txt;$('instbtn').hidden=!btn;$('inst').hidden=false};
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;show('Atver lapu kā aplikāciju.',true)});
  $('instbtn').onclick=()=>{if(dp){dp.prompt();dp=null;$('inst').hidden=true}};
  $('instx').onclick=()=>{$('inst').hidden=true;try{localStorage.setItem('instx','1')}catch(e){}};
  if(/iphone|ipad|ipod/i.test(navigator.userAgent))show('iPhone: spied Kopīgot, tad "Pievienot sākuma ekrānam".',false);
})();
